<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Wartets XP</title>
	<meta name="robots" content="noindex, follow">
	<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="preconnect" href="https://api.iconify.design" crossorigin>
	<link rel="dns-prefetch" href="https://api.iconify.design">
	<link rel="preconnect" href="https://img.icons8.com" crossorigin>
	<link rel="preconnect" href="https://cdn.quilljs.com" crossorigin>
	<link rel="preconnect" href="https://unpkg.com" crossorigin>
	<link rel="preload" href="../css/desk.css" as="style">
	<link rel="preload" href="../js/site-commons.js" as="script">
	<link rel="preload" href="script.js" as="script">
	<link rel="stylesheet" href="../css/desk.css">
	<link rel="stylesheet" href="../css/clippy.css">
	<link rel="icon" href="https://wartets.github.io/assets/images/browser-icon.png">
	<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
	<script src="../js/site-commons.js" defer></script>
	<meta name="description" content="Wartets' interactive portfolio as a dynamic Windows XP desktop.">
	<meta name="keywords" content="Wartets, Colin Bossu, portfolio, Windows XP, retro UI, interactive, simulations, fractals, physics, maths, music, game, art, 3D visualization">
	<meta property="og:title" content="Wartets' XP Portfolio | Interactive Retro Experience">
	<meta property="og:description" content="Explore Wartets' projects in a unique, dynamic Windows XP-themed portfolio.">
	<meta property="og:image" content="https://wartets.github.io/assets/images/app-icon.jpg">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://wartets.github.io/desk/">
	<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
	<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
	<script src="https://unpkg.com/webamp@1.4.2/built/webamp.bundle.min.js"></script>
</head>
<body>
	<div id="iframe-drag-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999999; display: none;"></div>

	<div id="boot-screen">
		<div class="boot-logo-container">
			<img src="../assets/images/desk/window_logo.png" alt="Windows XP" class="boot-logo">
			<div class="boot-text">Microsoft<br>Windows<span>XP</span></div>
		</div>
		<div class="boot-loading-bar">
			<div class="boot-loading-progress"></div>
			<div class="boot-loading-progress"></div>
			<div class="boot-loading-progress"></div>
		</div>
		<div class="boot-copyright">Copyright © 1985-2001<br>Microsoft Corporation</div>
	</div>

	<div id="welcome-screen" class="hidden">
		<div class="welcome-header"></div>
		<div class="welcome-content">
			<div class="welcome-logo">
				<img src="../assets/images/desk/window_logo.png" alt="Windows Logo">
				<span>Microsoft<br>Windows<span>XP</span></span>
			</div>
			<div class="welcome-divider"></div>
			<div class="welcome-users">
				<div class="welcome-user-item" id="login-user">
					<img src="../assets/images/desk/icons/User 1.webp" alt="User">
					<div class="welcome-user-info">
						<span class="welcome-username">Colin B.R.</span>
						<span class="welcome-status">Loading personal settings...</span>
					</div>
				</div>
			</div>
		</div>
		<div class="welcome-footer">
			<div class="turn-off-btn">
				<img src="https://api.iconify.design/mdi/power.svg" alt="Shutdown">
				<span>Turn off computer</span>
			</div>
		</div>
	</div>

	<div id="desktop" class="crt-scanlines">
		<div id="start-menu" class="xp-start-menu hidden crt-scanlines">
			<!-- Rendered dynamically by StartMenu Engine -->
		</div>

		<div id="project-icons-container">
			<!-- Project icons rendered here -->
		</div>
	</div>

	<div id="taskbar" class="crt-scanlines">
		<button type="button" id="taskbar-start-button" class="xp-taskbar-start">
			<span class="xp-start-flag">
				<img src="../assets/images/desk/window_logo.png" alt="Windows Logo" class="windows-logo">
			</span>
			<span class="xp-start-text">start</span>
		</button>

		<div class="quick-launch" id="quick-launch-bar">
			<div class="quick-launch-handle" title="Quick Launch"></div>
			<div class="quick-launch-icon-wrapper" id="show-desktop-icon" title="Show Desktop">
				<img src="../assets/images/desk/XPIcon.png" alt="Show Desktop" class="quick-launch-icon">
			</div>
			<div class="quick-launch-icon-wrapper" id="quick-launch-settings" title="Control Panel & Settings">
				<img src="../assets/images/desk/icons/System Properties.webp" alt="Control Panel" class="quick-launch-icon">
			</div>
			<div class="quick-launch-icon-wrapper" id="quick-launch-ie" title="Internet Explorer">
				<img src="../assets/images/desk/internet-explorer.png" alt="Internet Explorer" class="quick-launch-icon">
			</div>
			<div class="quick-launch-icon-wrapper" id="quick-launch-oe" title="Outlook Express">
				<img src="../assets/images/desk/OE2001.webp" alt="Outlook Express" class="quick-launch-icon">
				<span id="outlook-unread-badge" class="quick-launch-badge hidden"></span>
			</div>
			<div class="quick-launch-icon-wrapper" id="quick-launch-winamp" title="Winamp Media Player">
				<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Winamp-logo.svg/960px-Winamp-logo.svg.png" alt="Winamp" class="quick-launch-icon">
			</div>
			<div class="quick-launch-icon-wrapper" id="quick-launch-mine" title="Minesweeper">
				<img src="../assets/images/desk/icons/Minesweeper.webp" alt="Minesweeper" class="quick-launch-icon">
			</div>
		</div>

		<div class="taskbar-divider"></div>

		<div id="taskbar-windows">
		</div>

		<div id="taskbar-system-tray">
			<button type="button" id="tray-chevron-btn" class="tray-chevron" title="Show hidden notification icons">
				<span class="tray-chevron-arrow">&lt;</span>
			</button>
			<div id="tray-hidden-icons" class="tray-hidden-icons hidden">
				<div class="tray-icon-item" id="tray-network-btn" title="Local Area Connection - Speed: 100.0 Mbps">
					<img src="https://api.iconify.design/mdi/lan-connect.svg?color=%23ffffff" alt="Network">
				</div>
				<div class="tray-icon-item" id="tray-mail-btn" title="New e-mail messages" style="display: none;">
					<img src="https://api.iconify.design/mdi/email-outline.svg?color=%23ffffff" alt="Mail">
				</div>
			</div>
			<div class="tray-icon-item" id="tray-volume-btn" title="Volume">
				<img src="https://api.iconify.design/mdi/volume-high.svg?color=%23ffffff" alt="Volume">
			</div>
			<div id="clippy-taskbar-icon" class="tray-icon-item clippy-taskbar-icon" title="Microsoft Clippy Assistant">
				<img src="../assets/images/desk/clippy/idle.png" alt="Clippy" id="clippy-taskbar-img">
			</div>
			<div id="taskbar-clock" title="Date and Time"></div>
		</div>
	</div>

	<div id="taskbar-volume-popup" class="xp-volume-popup hidden">
		<div class="xp-volume-header">Master Volume</div>
		<div class="xp-volume-body">
			<input type="range" id="taskbar-volume-slider" min="0" max="1" step="0.05" value="0.7" orient="vertical" class="xp-vertical-slider">
		</div>
		<div class="xp-volume-footer">
			<label><input type="checkbox" id="taskbar-volume-mute"> Mute</label>
		</div>
	</div>

	<div id="window-area">
		<!-- Project windows opened here -->
	</div>

	<div id="calendar-popup" class="xp-window hidden">
		<div id="calendar-header">
			<button id="calendar-prev">&lt;</button>
			<span id="calendar-month-year"></span>
			<button id="calendar-next">&gt;</button>
		</div>
		<div id="calendar-days-header">
			<div>Su</div>
			<div>Mo</div>
			<div>Tu</div>
			<div>We</div>
			<div>Th</div>
			<div>Fr</div>
			<div>Sa</div>
		</div>
		<div id="calendar-grid"></div>
		<div id="calendar-footer">
			<span id="calendar-today-date"></span>
		</div>
	</div>

	<script src="../data/projects.js"></script>
	<script src="../data/library.js"></script>
	<script src="../data/poetry.js"></script>
	<script src="../data/mails.js"></script>
	<script src="../js/desk/mail-store.js"></script>
	<script src="../js/desk/context-menu.js"></script>
	<script src="../js/desk/taskbar.js"></script>
	<script src="../js/desk/clippy.js"></script>
	<script src="../js/desk/settings.js"></script>
	<script src="../js/desk/start-menu.js"></script>

	<div id="scanlines-overlay" aria-hidden="true"></div>

	<script src="script.js"></script>
</body>
</html>
