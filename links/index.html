<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Links</title>
	<meta name="robots" content="noindex, nofollow">
	<link rel="icon" href="https://wartets.github.io/assets/images/browser-icon.png">
	<script src="../js/site-commons.js" defer></script>
	<style>
		body { background: #050505; color: #d0d0d0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; max-width: 720px; margin: 0 auto; padding: 2rem 1.5rem; }
		h1 { font-size: 1.4rem; font-weight: 600; margin: 2rem 0 0.75rem; }
		h1:first-of-type { margin-top: 0; }
		ul { list-style: none; margin: 0; padding: 0; }
		li { padding: 2px 0; }
		a { color: #8ab4ff; text-decoration: none; }
		a:hover { text-decoration: underline; }
		.label { color: #777; font-size: 0.85rem; margin-left: 8px; }
		li { opacity: 0; transform: translateY(6px); animation: linksItemReveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
		@keyframes linksItemReveal { to { opacity: 1; transform: translateY(0); } }
		@media (prefers-reduced-motion: reduce) { li { animation: none; opacity: 1; transform: none; } }
	</style>
</head>
<body>
	<h1>Pages</h1>
	<ul id="internal-links"></ul>
	<h1>Networks</h1>
	<ul id="social-links"></ul>
	<h1>Projects</h1>
	<ul id="project-links"></ul>
	<h1>Documents (PDF)</h1>
	<ul id="pdf-links"></ul>
	<h1>Poems</h1>
	<ul id="poem-links"></ul>
	<script src="../data/projects.js"></script>
	<script src="../data/library.js"></script>
	<script src="script.js"></script>
</body>
</html>
